{% extends "base.html" %}
{% block content %}
  <div class="message">
    <h1>Something went wrong</h1>
    <p>{{ detail or "An unexpected error occurred on our side. Check your request and try again later." }}</p>

    {% if error_id %}
      <p class="muted">Error ID: <code>{{ error_id }}</code></p>
    {% endif %}

    <a class="button" href="{{ return_url or url_for('get_home_page') }}">{{ return_label or "Back to home" }}</a>
  </div>
{% endblock %}
